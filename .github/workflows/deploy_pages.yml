name: Deploy Flutter Web → GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        # Cambia /Ganajec/ por el nombre exacto de tu repo en GitHub (case-sensitive)
        # API_URL debe ser HTTPS para que el navegador permita las peticiones
        run: flutter build web --release --base-href /Ganajec/ --dart-define=API_URL=https://ganajec.duckdns.org/api

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
